      <stop offset="0%" stop-color="#faf3e2"/>
      <stop offset="55%" stop-color="#f1ead6"/>
      <stop offset="85%" stop-color="#e6d8b6"/>
      <stop offset="100%" stop-color="#cdbb92"/>
